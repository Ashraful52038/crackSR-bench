# Stage 1: EfficientNetV2-S fine-tuned end to end.
task: classification
out_dir: runs/cls_efficientnetv2
seed: 42
model:
  name: tf_efficientnetv2_s.in21k_ft_in1k
  num_classes: 2
  pretrained: true
  img_size: 224
data:
  root: data/ccic              # CCIC: Negative/ and Positive/ sub-folders, split below with a fixed seed
  val_frac: 0.15
  test_frac: 0.15
  split_seed: 0
  extra_test:                  # out-of-domain test sets with the same class folders
    field: data/field
train:
  epochs: 5
  batch_size: 64
  lr: 2.0e-4
  weight_decay: 0.05
  warmup_epochs: 1
  label_smoothing: 0.1
  amp: true
  num_workers: 2
