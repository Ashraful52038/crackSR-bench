# Stage 2: Real-ESRGAN generator (RRDBNet, 16.7M params) initialised from RealESRGAN_x4plus
# and fine-tuned with L1 on crack images (PSNR-oriented; no GAN loss, to limit hallucination).
# Set init_weights: null to train from scratch.
task: sr
out_dir: runs/sr_realesrgan
seed: 42
model:
  name: rrdbnet
  init_weights: weights/RealESRGAN_x4plus.pth
  kwargs:
    num_feat: 64
    num_block: 23
eval:
  tile: 256
data:
  scale: 4
  train_hr: data/seg/train/images       # SR is trained on crack images (HR only, LR made on the fly)
  val_hr: data/seg/val/images
  val_lr: data/seg/val/lr_x4_real       # made once by scripts/degrade.py
  test_hr: data/seg/test/images
  test_lr: data/seg/test/lr_x4_real
  degradation: configs/degradation_real.yaml   # use {mode: bicubic} for the classic setting
  patch_size: 256                        # HR patch side
  repeat: 20                            # samples per image per "epoch" (small datasets)
  crop_border: 4
  val_limit: 50
train:
  iters: 30000
  batch_size: 8
  lr: 1.0e-4
  loss: l1
  amp: true
  val_every: 2000
  num_workers: 2
